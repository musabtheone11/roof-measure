name: Self-contained roof laboratory

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Generate a cycle, review retained results, or qualify three subscription models
        type: choice
        options: [cycle, review-existing, allowance-qualification]
        default: cycle
      review_run_id:
        description: Completed laboratory run to review (review-existing only)
        type: string
        default: ''
      review_run_attempt:
        description: Retained artifact attempt number
        type: string
        default: '1'
      generate_missing_designs:
        description: One bounded new qualification per previously failed design model
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# One global ledger, including manual runs on other branches. Never cancel a
# runner that might have spent money before its checkpoint was uploaded.
concurrency:
  group: roof-cloud-shared-ledger
  cancel-in-progress: false

jobs:
  generate-review-and-retain:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      source_revision: ${{ steps.source.outputs.revision }}
      browser_status: ${{ steps.browser.outcome }}
      report_artifact_id: ${{ steps.reports.outputs.artifact-id }}
    env:
      STATE_DIR: .cloud-state
      OUTPUT_DIR: cloud-output
    steps:
      - uses: actions/checkout@v4
        with:
          ref: af61db083819e92ae6b89a6b4433623dbb0b225b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Freeze source revision
        id: source
        run: |
          echo "ROOF_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore shared budget and workflow checkpoint
        id: bootstrap
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --use-env-proxy organization/cloud-operations.mjs bootstrap --state "$STATE_DIR"
      - name: Install pinned dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix bench --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser and PDF inspection tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          node -e "console.log('CHROMIUM_PATH='+require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Exercise the actual application PDF and ZIP workflow
        id: browser
        continue-on-error: true
        run: node tools/dev/source-review-delivery-test.mjs
      - name: Download retained baseline for targeted review
        if: inputs.operation == 'review-existing'
        uses: actions/download-artifact@v4
        with:
          name: roof-cloud-reports-${{ inputs.review_run_id }}-${{ inputs.review_run_attempt }}
          run-id: ${{ inputs.review_run_id }}
          github-token: ${{ github.token }}
          path: baseline-input
      - name: Generate cases, run the application and independently review reports
        id: cycle
        continue-on-error: true
        env:
          APINEX_API_KEY: ${{ secrets.ROOF_ORG_APINEX_API_KEY || secrets.APINEX_API_KEY }}
          ROOF_CLOUD_PAID_ALLOWED: ${{ steps.bootstrap.outputs.paid_allowed }}
          ROOF_CLOUD_BROWSER_STATUS: ${{ steps.browser.outcome }}
          ROOF_CLOUD_MODEL_MODE: ${{ inputs.operation == 'allowance-qualification' && 'allowance-qualification' || 'all-models' }}
          ROOF_CLOUD_OPERATION: ${{ inputs.operation || 'cycle' }}
          ROOF_REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          ROOF_GENERATE_MISSING_DESIGNS: ${{ inputs.generate_missing_designs }}
        run: |
          if [ "$ROOF_CLOUD_OPERATION" = "review-existing" ]; then
            review_args=()
            if [ "$ROOF_GENERATE_MISSING_DESIGNS" = "true" ]; then
              review_args+=(--generate-missing-designs)
            fi
            node --use-env-proxy organization/review-followup.mjs --state "$STATE_DIR" --baseline baseline-input/cloud-output --output "$OUTPUT_DIR" --baseline-run "$ROOF_REVIEW_RUN_ID" "${review_args[@]}"
          else
            node --use-env-proxy organization/cloud-cycle.mjs --state "$STATE_DIR" --output "$OUTPUT_DIR" --count 12 --seed "${{ github.run_number }}"
          fi
      - name: Close and fingerprint cloud state
        if: always() && steps.bootstrap.outcome == 'success'
        run: node organization/cloud-operations.mjs checkpoint --state "$STATE_DIR"
      - name: Retain durable workflow state
        if: always() && steps.bootstrap.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: roof-cloud-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cloud-state/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Create downloadable report bundle
        if: always() && steps.cycle.outcome != 'skipped'
        run: node organization/cloud-operations.mjs pack --output "$OUTPUT_DIR" --archive roof-cloud-reports.zip
      - name: Retain reports for users to download
        id: reports
        if: always() && steps.cycle.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: roof-cloud-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            roof-cloud-reports.zip
            cloud-output/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve failed-cycle status after retaining evidence
        if: steps.cycle.outcome == 'failure' || steps.browser.outcome == 'failure'
        run: exit 1
  publish-status:
    needs: generate-review-and-retain
    # A three-model qualification is retained as a separate experiment; it must
    # not replace the public journal's complete 51-model roster.
    if: always() && needs.generate-review-and-retain.outputs.source_revision != '' && inputs.operation != 'allowance-qualification'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate-review-and-retain.outputs.source_revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download completed report artifact
        if: needs.generate-review-and-retain.outputs.report_artifact_id != ''
        uses: actions/download-artifact@v4
        with:
          name: roof-cloud-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: publish-input
      - name: Publish sanitized evaluation journal with compare-and-swap
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROOF_SOURCE_REVISION: ${{ needs.generate-review-and-retain.outputs.source_revision }}
          ROOF_CLOUD_GENERATION_RESULT: ${{ needs.generate-review-and-retain.result }}
          ROOF_CLOUD_BROWSER_STATUS: ${{ needs.generate-review-and-retain.outputs.browser_status }}
          ROOF_CLOUD_ARTIFACT_AVAILABLE: ${{ needs.generate-review-and-retain.outputs.report_artifact_id != '' }}
        run: node --use-env-proxy organization/cloud-operations.mjs publish-status --cycle publish-input/cloud-output/cycle.json
