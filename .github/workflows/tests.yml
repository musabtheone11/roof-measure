name: tests

on:
  push:
    branches: [main, fix/autotrace-accuracy]
  pull_request:

jobs:
  preview-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROOF_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ROOF_REVISION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build pinned private preview image and check its authenticated runtime
        run: |
          docker build --build-arg ROOF_REVISION="$ROOF_REVISION" -t roof-measure-private-preview:review .
          node tools/dev/preview-container-test.mjs
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bench/package-lock.json
      - name: Install benchmark dependencies
        run: npm ci
        working-directory: bench
      - name: Syntax check of the app scripts
        run: for f in *.js; do node -e "new Function(require('fs').readFileSync('$f','utf8'))" || exit 1; done
      - name: Measurement model (roofmodel.js)
        run: node modeltest.mjs
        working-directory: bench
      - name: Plain roofs trace exactly
        run: node smoke.mjs
        working-directory: bench
      - name: Roof colours and tree canopy
        run: node colourtest.mjs
        working-directory: bench
      - name: Regression fixtures (defects found on the regional benchmark)
        run: node fixtures.mjs
        working-directory: bench
      - name: Report acceptance example and status rules
        run: node reporttest.mjs
        working-directory: bench
      - name: Independent PDF reconciliation (consistent, altered, stale, dropped line)
        run: node reconciletest.mjs
        working-directory: bench
      - name: Mixed-pitch, multi-level takeoff (hand-derived expectations)
        run: node takeofftest.mjs
        working-directory: bench
      - name: Roof summary totals (two-story, two-layer and average pitch net of cut-outs)
        run: node summarytest.mjs
        working-directory: bench
      - name: Vision-review fusion (corner moved back on evidence, decoy refused, canopy corner never moved, missed shed opened)
        run: node visiontest.mjs
        working-directory: bench
      - name: Evidence provenance, geometry support, plan layout and stale exports
        run: |
          node evidence-gate-test.mjs
          node evidence-ui-test.mjs
          node geometrytest.mjs
          node planfirsttest.mjs
          node stale-report-test.mjs
          node net-area-test.mjs
          node report-information-test.mjs
          node location-lifecycle-test.mjs
          node registrationtest.mjs
          node registration-stress.mjs
          node trace-race-test.mjs
          node spatial-test.mjs
          node evidence-notes-test.mjs
          node batch-update-test.mjs
          node layer-cache-test.mjs
          node map-label-test.mjs
          node --test target-intent-test.mjs
          node roof-invariants.mjs
          node canopy-ambiguity.mjs
          node trace-evidence-test.mjs
          node bump-regression-test.mjs
          node straight-edge-test.mjs
          node steep-drop-test.mjs
          node gable-control-test.mjs
        working-directory: bench
      - name: Server-side AI geometry and orchestration contracts
        run: |
          node --test server/*.test.mjs
          node bench/runtime-agents-test.mjs
      - name: Source-image report quantity and revision checks
        run: node bench/ai-report-test.mjs
      - name: Durable organization and customer report contracts
        run: |
          npm ci --ignore-scripts
          node --test organization/*.test.mjs
          node bench/customer-report-test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bounded specialist dispatch and recovery
        run: python tools/dev/test_specialist_sweep.py
      - name: Install pinned browser test dependencies
        run: |
          npx playwright install --with-deps chromium
          python -m pip install PyMuPDF==1.26.6
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Browser source review, local PDF pages and rendered reports
        run: |
          node tools/dev/ai-ui-test.mjs
          node tools/dev/ai-cancel-ui-test.mjs
          node tools/dev/ai-source-restrictions-test.mjs
          node tools/dev/ai-boundary-review-test.mjs
          node tools/dev/pdf-ui-test.mjs
          node tools/dev/ai-report-test.mjs
          node tools/dev/source-review-delivery-test.mjs
          node tools/dev/source-review-recovery-test.mjs
          node tools/dev/map-pointer-test.mjs
          node tools/dev/static-ai-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-review-browser-artifacts
          path: .devcache/ai-report-tests/
          if-no-files-found: ignore
